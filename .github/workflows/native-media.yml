name: Native Media Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  WEBRTC_BRANCH: branch-heads/7339
  WEBRTC_REVISION: m140
  LIBMEDIASOUPCLIENT_REPOSITORY: https://github.com/versatica/libmediasoupclient.git
  LIBMEDIASOUPCLIENT_REF: webrtc-m140
  LIBMEDIASOUPCLIENT_COMMIT: b9602ba50477d9a22b673fc3e6b5abff16c02deb
  NATIVE_MEDIA_WITH_MEDIASOUP: "1"
  NATIVE_MEDIA_TARGETS: macos-arm64,windows-x64

defaults:
  run:
    shell: bash

jobs:
  resolve-native-media:
    name: Resolve native media bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      provision_mode: ${{ steps.resolve.outputs.provision_mode }}
      reuse_webrtc: ${{ steps.resolve.outputs.reuse_webrtc }}
    steps:
      - name: Checkout dSpeak history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve whether native media needs rebuilding
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_tag="webrtc-${WEBRTC_REVISION}"
          release_json="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json body,assets 2>/dev/null || true)"
          provision_mode=source
          reuse_webrtc=false
          reason="the durable native media release is unavailable"

          if [[ -n "$release_json" ]]; then
            release_body="$(jq -r '.body // ""' <<<"$release_json")"
            baseline_commit="$(sed -n 's/^Native media source commit: //p' <<<"$release_body" | head -1)"

            if [[ -z "$baseline_commit" ]]; then
              git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag" >/dev/null 2>&1 || true
              baseline_commit="$(git rev-parse "refs/tags/$release_tag^{commit}" 2>/dev/null || true)"
            fi

            missing_asset=""
            IFS=',' read -r -a native_platforms <<< "$NATIVE_MEDIA_TARGETS"
            for platform in "${native_platforms[@]}"; do
              asset="lib-dspeak-media-${platform}.tar.gz"
              if ! jq -e --arg asset "$asset" '.assets[]? | select(.name == $asset)' <<<"$release_json" >/dev/null; then
                missing_asset="$asset"
                break
              fi
            done

            if [[ -n "$missing_asset" ]]; then
              reason="the durable release is missing $missing_asset"
            elif [[ -z "$baseline_commit" ]]; then
              reason="the durable release has no native source baseline"
            elif ! git cat-file -e "$baseline_commit^{commit}" 2>/dev/null; then
              reason="the native source baseline is unavailable in Git"
            elif ! git merge-base --is-ancestor "$baseline_commit" "$GITHUB_SHA"; then
              reason="the current release is not based on the native source baseline"
            elif ! git diff --quiet "$baseline_commit" "$GITHUB_SHA" -- \
              desktop/scripts/provision-native-media.sh \
              desktop/native-media/libdspeak_media \
              desktop/native-media/platform; then
              reason="native media source files changed since the last bundle"
            elif ! grep -Fqx "libwebrtc: ${WEBRTC_REVISION} (${WEBRTC_BRANCH})" <<<"$release_body"; then
              reason="the pinned libwebrtc input changed since the last bundle"
            elif ! grep -Fqx "libmediasoupclient: ${LIBMEDIASOUPCLIENT_REF} (${LIBMEDIASOUPCLIENT_COMMIT})" <<<"$release_body"; then
              reason="the pinned libmediasoupclient input changed since the last bundle"
            elif grep -q '^Native media mode:' <<<"$release_body" &&
              ! grep -Fqx "Native media mode: ${NATIVE_MEDIA_WITH_MEDIASOUP}" <<<"$release_body"; then
              reason="the native transport mode changed since the last bundle"
            elif [[ "$NATIVE_MEDIA_WITH_MEDIASOUP" != "0" ]] &&
              grep -Fqx "The self-hosted mediasoupclient transport is disabled in these bundles." <<<"$release_body"; then
              reason="the native transport mode changed since the legacy bundle"
            else
              provision_mode=download
              reason="native media inputs are unchanged; reusing $release_tag"
            fi

            if [[ -z "$missing_asset" ]] &&
              grep -Fqx "libwebrtc: ${WEBRTC_REVISION} (${WEBRTC_BRANCH})" <<<"$release_body" &&
              [[ -n "$baseline_commit" ]] &&
              git cat-file -e "$baseline_commit^{commit}" 2>/dev/null &&
              git merge-base --is-ancestor "$baseline_commit" "$GITHUB_SHA"; then
              reuse_webrtc=true
            fi
          fi

          printf 'Native media provisioning mode: %s (%s)\n' "$provision_mode" "$reason"
          echo "provision_mode=$provision_mode" >> "$GITHUB_OUTPUT"
          echo "reuse_webrtc=$reuse_webrtc" >> "$GITHUB_OUTPUT"

  build-dev-native-media:
    name: Build native media with desktop provisioner (${{ matrix.platform }})
    needs: resolve-native-media
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: self-hosted
            target_triple: aarch64-apple-darwin
            artifact: lib-dspeak-media-macos-arm64
          - platform: windows-x64
            runner: windows-2022
            target_triple: x86_64-pc-windows-msvc
            artifact: lib-dspeak-media-windows-x64
    steps:
      - name: Checkout dSpeak
        uses: actions/checkout@v4

      - name: Download native media base for WebRTC reuse
        if: needs.resolve-native-media.outputs.provision_mode == 'source' && needs.resolve-native-media.outputs.reuse_webrtc == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_dir="$RUNNER_TEMP/native-base"
          mkdir -p "$base_dir"
          gh release download "webrtc-${WEBRTC_REVISION}" \
            --repo "$GITHUB_REPOSITORY" \
            -p "lib-dspeak-media-${{ matrix.platform }}.tar.gz" \
            -D "$base_dir" \
            --clobber
          if command -v cygpath >/dev/null 2>&1; then
            base_dir="$(cygpath -u "$base_dir")"
          fi
          archive="$(find "$base_dir" -type f -name '*.tar.gz' -print -quit)"
          [[ -n "$archive" ]] || {
            echo "::error::The durable native media release did not provide a base archive for WebRTC reuse." >&2
            exit 1
          }
          echo "NATIVE_MEDIA_BASE_ARTIFACT_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Provision native media with dev-desktop logic
        env:
          NATIVE_MEDIA_PROVISION_MODE: ${{ needs.resolve-native-media.outputs.provision_mode }}
          NATIVE_MEDIA_TARGET_TRIPLE: ${{ matrix.target_triple }}
          NATIVE_MEDIA_ARTIFACT_DIR: .ci-native-media-${{ github.run_id }}/artifact
          NATIVE_MEDIA_BUILD_DIR: .ci-native-media-${{ github.run_id }}/build
        run: bash desktop/scripts/provision-native-media.sh

      - name: Package complete native bundle
        run: |
          tar czf ".ci-native-media-${{ github.run_id }}/${{ matrix.artifact }}.tar.gz" \
            -C ".ci-native-media-${{ github.run_id }}" artifact/

      - name: Upload complete native bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .ci-native-media-${{ github.run_id }}/${{ matrix.artifact }}.tar.gz
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs:
      - resolve-native-media
      - build-dev-native-media
    if: needs.resolve-native-media.outputs.provision_mode == 'source'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release notes file
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          Pre-built native media artifacts for dspeak desktop.

          libwebrtc: ${{ env.WEBRTC_REVISION }} (${{ env.WEBRTC_BRANCH }})
          libmediasoupclient: ${{ env.LIBMEDIASOUPCLIENT_REF }} (${{ env.LIBMEDIASOUPCLIENT_COMMIT }})
          Native media targets: ${{ env.NATIVE_MEDIA_TARGETS }}
          Native media mode: ${{ env.NATIVE_MEDIA_WITH_MEDIASOUP }}
          Native media source commit: ${{ github.sha }}

          Artifacts contain:
          - lib/libwebrtc.a (.lib on Windows)
          - lib/libdspeak_media.a (.lib on Windows)
          - include/ (libwebrtc and shim build headers)

          The self-hosted mediasoupclient transport is included in these desktop bundles.

          Use with desktop/native-media/dependencies.env pointing to the extracted artifact directory.
          EOF

      - name: Create or replace release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="webrtc-${{ env.WEBRTC_REVISION }}"
          gh release delete "${RELEASE_TAG}" --repo ${{ github.repository }} --yes 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --repo ${{ github.repository }} \
            --title "libwebrtc ${{ env.WEBRTC_REVISION }} (${{ env.WEBRTC_BRANCH }}) + libmediasoupclient ${{ env.LIBMEDIASOUPCLIENT_REF }}" \
            --notes-file /tmp/release-notes.md \
            artifacts/*.tar.gz
