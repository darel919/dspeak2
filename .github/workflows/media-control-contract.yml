name: Media control contract

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dSpeak
        uses: actions/checkout@v4
        with:
          path: dspeak
      - name: Check out media-control
        uses: actions/checkout@v4
        with:
          repository: darel919/dspeak-media-control
          ref: main
          path: dspeak-media-control
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dSpeak dependencies
        working-directory: dspeak
        run: bun install --frozen-lockfile
      - name: Verify the live wire contract
        working-directory: dspeak
        env:
          DSPEAK_MEDIA_CONTROL_PATH: ../dspeak-media-control
        run: bun run verify:media-control-contract
