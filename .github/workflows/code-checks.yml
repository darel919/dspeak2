# Fast code checks that must pass on every commit.
#
# Runs format, lint, and tests on plain pushes and pull requests so style,
# anti-slop, and test failures are caught cheaply on a free runner, long
# before the expensive desktop-build pipeline (which chains off
# native-media) gets a chance to download dependencies and fail on the
# same issues.

name: Code Checks

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Format, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test
