[package]
name = "dspeak-desktop"
version = "3.0.2-alpha.1"
edition = "2021"
default-run = "dspeak-desktop"

[[bin]]
name = "dspeak-media"
path = "src/bin/dspeak-media.rs"
required-features = ["media-worker"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools", "unstable"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-keyring-store = "0.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
notify-rust = "4"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt", "time", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.7"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
softbuffer = "0.4"
font8x8 = "0.3"
tauri-plugin-dialog = "2.7.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native_rtc = []
media-worker = []

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
