services:
  dspeak:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DSPEAK_PUBLIC_ORIGIN: ${DSPEAK_PUBLIC_ORIGIN:-}
      DSPEAK_TRUST_PROXY: ${DSPEAK_TRUST_PROXY:-true}
      DSPEAK_METRICS_TOKEN: ${DSPEAK_METRICS_TOKEN:-}
      DSPEAK_CSRF_SECRET: ${DSPEAK_CSRF_SECRET:-}
      DSPEAK_PUSH_ALLOWED_HOSTS: ${DSPEAK_PUSH_ALLOWED_HOSTS:-}
      DATABASE_URL: ${DATABASE_URL:?Set the Supabase Postgres connection string}
      SUPABASE_URL: ${SUPABASE_URL:?Set the Supabase project URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?Set the Supabase anonymous key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set the Supabase service role key}
      MEDIA_CONTROL_URL: ${MEDIA_CONTROL_URL:?Set the media-control Worker URL}
      MEDIA_CONTROL_ADMIN_TOKEN: ${MEDIA_CONTROL_ADMIN_TOKEN:?Set the media-control admin token}

      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PUBKEY: ${VAPID_PUBKEY:-}
      VAPID_PRIVKEY: ${VAPID_PRIVKEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}

      DSPEAK_RTC_DOMAIN: ${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:-}
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-900}
      DSPEAK_OPUS_BITRATE_DEFAULT: ${DSPEAK_OPUS_BITRATE_DEFAULT:-128}
    ports:
      - "${DSPEAK_HTTP_PORT:-31100}:3000/tcp"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  coturn:
    build:
      context: .
      dockerfile: ops/coturn/Dockerfile
    network_mode: host
    environment:
      DSPEAK_RTC_DOMAIN: ${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
    command:
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --tls-listening-port=${TURN_TLS_PORT:-5349}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49259}
      - --realm=${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
      - --server-name=${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?Generate a strong TURN shared secret}
      - --cert=/etc/letsencrypt/runtime/fullchain.pem
      - --pkey=/etc/letsencrypt/runtime/privkey.pem
      - --fingerprint
      - --stale-nonce=600
      - --user-quota=${TURN_USER_QUOTA:-12}
      - --total-quota=${TURN_TOTAL_QUOTA:-1200}
      - --max-bps=${TURN_MAX_BPS:-25000000}
      - --no-cli
      - --no-multicast-peers
      - --no-tcp-relay
      - --no-dtls
      - --no-software-attribute
    volumes:
      - turn-certificates:/etc/letsencrypt:ro
    healthcheck:
      test: [CMD, turnutils_stunclient, -p, "${TURN_PORT:-3478}", "::1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  turn-certbot:
    build:
      context: .
      dockerfile: ops/certbot/Dockerfile
    environment:
      DSPEAK_RTC_DOMAIN: ${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
      TURN_CERT_EMAIL: ${TURN_CERT_EMAIL:?Set the email used for TURN certificate renewal}
      TURN_CLOUDFLARE_API_TOKEN: ${TURN_CLOUDFLARE_API_TOKEN:?Create a scoped Cloudflare DNS token for TURN certificates}
      TURN_CERT_DNS_PROPAGATION_SECONDS: ${TURN_CERT_DNS_PROPAGATION_SECONDS:-30}
    volumes:
      - turn-certificates:/etc/letsencrypt
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test -s /etc/letsencrypt/runtime/fullchain.pem && test -s /etc/letsencrypt/runtime/privkey.pem",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    network_mode: host
    environment:
      CLOUDFLARE_API_TOKEN: ${DSPEAK_CLOUDFLARE_API_TOKEN:?Create a Cloudflare token with Zone DNS Edit access}
      IP6_DOMAINS: ${DSPEAK_RTC_DOMAIN:-rtc.dspeak.example.com}
      IP4_PROVIDER: none
      IP6_PROVIDER: ${DSPEAK_DDNS_IP6_PROVIDER:-local.iface:ens3}
      PROXIED: "false"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  turn-certificates:
